# Current Supabase API and React admin. The legacy render.yaml remains separate.
# Select this file as the Blueprint path; supply secret values in Render only.
services:
  - type: web
    name: movetraq-production-api
    runtime: node
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LEGACY_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_REDIRECT_URL
        sync: false
      - key: ADMIN_INVITE_REDIRECT_URL
        sync: false
      - key: PAYMENT_PROVIDER
        value: paystack
      - key: PAYMENT_SECRET_KEY
        sync: false
      - key: PAYMENT_CALLBACK_URL
        sync: false
      - key: MOBILE_MONITORING_URL
        value: https://movetraq-api.onrender.com
      - key: MONITORING_SERVICE_TOKEN
        sync: false
      - key: MAPS_PROVIDER
        value: osm
      - key: GEOCODER_PROVIDER
        value: photon
      - key: PHOTON_URL
        value: https://photon.komoot.io
      - key: OSRM_URL
        value: https://router.project-osrm.org
      - key: NOMINATIM_URL
        value: https://nominatim.openstreetmap.org
  - type: web
    name: movetraq-production-admin
    runtime: static
    branch: main
    buildCommand: cd admin && npm ci --include=dev && npm run build
    staticPublishPath: admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
