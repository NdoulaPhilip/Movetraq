services:
  - type: web
    name: movetraq-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DISABLE_TEST_WALLET_TOPUPS
        value: "true"
      - key: MOVETRAQ_PUBLIC_API_URL
        sync: false
      - key: PAYMENT_SECRET_KEY
        sync: false
      - key: MONITORING_SERVICE_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
