<!doctype html>
<html lang="en">
<body style="margin:0;background:#f7f9f0;font-family:Arial,sans-serif;color:#101319">
  <div style="max-width:480px;margin:32px auto;padding:32px;background:white;border-radius:24px">
    <p style="font-weight:700;font-size:22px">MoveTraq</p>
    <h1 style="font-size:28px">Confirm your email.</h1>
    <p style="color:#7b8590;line-height:1.6">Return to MoveTraq and enter this confirmation code to finish creating your account.</p>
    <div style="background:#cbf24a;border-radius:16px;padding:24px;text-align:center;font-size:32px;font-weight:bold;letter-spacing:8px">{{ .Token }}</div>
    <p style="color:#7b8590;line-height:1.6">Do not share this code. If it expires, tap Resend code in the app.</p>
    <p style="font-size:12px;color:#7b8590">If you did not create a MoveTraq account, you can ignore this email.</p>
  </div>
</body>
</html>
